# The release definition: what this release is made of, where each package's
# source came from, and the exact published file its name resolves to.
#
# Authored state. tools/draft-manifest.sh helps write it and
# tools/resolve-manifest.sh checks it, but neither may quietly repair it —
# what is written here is what the release is.
#
# ref is the tag where a tag governs the build, and otherwise the commit the
# release was built at. The comments on the derived entries say where that
# commit came from and are part of the record, not decoration.

