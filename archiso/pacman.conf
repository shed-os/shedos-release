#
# ShedOS pacman.conf for ISO build
#

[options]
HoldPkg     = pacman glibc
Architecture = x86_64
Color
CheckSpace
ParallelDownloads = 2
SigLevel    = Never
LocalFileSigLevel = Optional

# Download settings with aggressive retry
XferCommand = /usr/bin/curl -L -C - -f --retry 10 --retry-delay 5 --retry-max-time 60 --connect-timeout 30 -o %o %u

# ShedOS local repo (for AUR packages like calamares)
[shedos-repo]
SigLevel = Optional TrustAll
Server = file:///home/theshedman/Documents/projects/theshedman/shedos/archiso/shedos-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist
