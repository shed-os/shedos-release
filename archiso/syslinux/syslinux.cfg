DEFAULT shedos
PROMPT 0
TIMEOUT 50

UI vesamenu.c32

MENU TITLE ShedOS Boot Menu
MENU RESOLUTION 1024 768
MENU COLOR border       30;44    #40ffffff #a0000000 std
MENU COLOR title        1;36;44  #9033ccff #a0000000 std
MENU COLOR sel          7;37;40  #e0ffffff #20ffffff all
MENU COLOR unsel        37;44    #50ffffff #a0000000 std
MENU COLOR help         37;40    #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40    #80ffffff #00000000 std
MENU COLOR timeout      1;37;40  #c0ffffff #00000000 std
MENU COLOR msg07        37;40    #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40    #30ffffff #00000000 std

LABEL shedos
    MENU LABEL ^ShedOS Linux
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% cow_spacesize=2G quiet splash loglevel=3

LABEL shedos_nvidia
    MENU LABEL ShedOS Linux (^NVIDIA)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nvidia_drm.modeset=1 cow_spacesize=2G quiet splash loglevel=3

LABEL shedos_safe
    MENU LABEL ShedOS Linux (^safe graphics)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% nomodeset cow_spacesize=2G

LABEL shedos_ram
    MENU LABEL ShedOS Linux (^copy to RAM)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-zen
    INITRD /%INSTALL_DIR%/boot/x86_64/initramfs-linux-zen.img
    APPEND archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% copytoram cow_spacesize=2G quiet splash loglevel=3

LABEL memtest
    MENU LABEL ^Memory Test (memtest86+)
    LINUX /%INSTALL_DIR%/boot/memtest86+/memtest.bin

LABEL reboot
    MENU LABEL ^Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL ^Power Off
    COM32 poweroff.c32
