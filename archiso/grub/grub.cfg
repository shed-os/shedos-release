# ShedOS GRUB Configuration for ISO

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

# Default boot entry
set default="shedos"
set timeout=5

# Load video modules
insmod all_video
set gfxmode=auto
set gfxpayload=keep

if loadfont "${prefix}/fonts/unicode.pf2"; then
    terminal_input console
    terminal_output gfxterm
fi

menuentry "ShedOS Linux" --class arch --class gnu-linux --class gnu --class os --id "shedos" {
    set gfxpayload=keep
    search --no-floppy --set=root --label SHEDOS_*
    linux /shedos/boot/x86_64/vmlinuz-linux archisobasedir=shedos archisolabel=SHEDOS_* cow_spacesize=4G quiet splash loglevel=3
    initrd /shedos/boot/x86_64/initramfs-linux.img
}

menuentry "ShedOS Linux (NVIDIA)" --class arch --class gnu-linux --class gnu --class os --id "shedos-nvidia" {
    set gfxpayload=keep
    search --no-floppy --set=root --label SHEDOS_*
    linux /shedos/boot/x86_64/vmlinuz-linux archisobasedir=shedos archisolabel=SHEDOS_* nvidia_drm.modeset=1 cow_spacesize=4G quiet splash loglevel=3
    initrd /shedos/boot/x86_64/initramfs-linux.img
}

menuentry "ShedOS Linux (nomodeset - safe graphics)" --class arch --class gnu-linux --class gnu --class os --id "shedos-safe" {
    set gfxpayload=keep
    search --no-floppy --set=root --label SHEDOS_*
    linux /shedos/boot/x86_64/vmlinuz-linux archisobasedir=shedos archisolabel=SHEDOS_* nomodeset cow_spacesize=4G
    initrd /shedos/boot/x86_64/initramfs-linux.img
}

menuentry "ShedOS Linux (copy to RAM)" --class arch --class gnu-linux --class gnu --class os --id "shedos-ram" {
    set gfxpayload=keep
    search --no-floppy --set=root --label SHEDOS_*
    linux /shedos/boot/x86_64/vmlinuz-linux archisobasedir=shedos archisolabel=SHEDOS_* copytoram cow_spacesize=4G quiet splash loglevel=3
    initrd /shedos/boot/x86_64/initramfs-linux.img
}

if [ "${grub_platform}" == "efi" ]; then
    menuentry "UEFI Firmware Settings" --id "uefi-firmware" {
        fwsetup
    }
fi

menuentry "System restart" --class restart --id "restart" {
    reboot
}

menuentry "System shutdown" --class shutdown --id "shutdown" {
    halt
}
