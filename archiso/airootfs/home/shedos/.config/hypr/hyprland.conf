# ShedOS Live Installer — minimal Hyprland config.
# Brings up: dusk wallpaper, waybar (with Wi-Fi tray), notifications,
# welcome popup, and Calamares. No login UI; agetty + .zprofile drop
# the shedos user straight into this session on tty1.

monitor = ,preferred,auto,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11

exec-once = swaybg -i /usr/share/shedos/wallpapers/dusk.png -m fill
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = mako
exec-once = sleep 3 && yad --image=network-wireless --title="Welcome to ShedOS" --text="<b>Connect to Wi-Fi before installing.</b>\n\nClick the network icon in the top-right of the bar, pick your network, enter the password.\n\nThe Calamares installer will open automatically." --button=gtk-ok --width=420
exec-once = sleep 5 && sudo -E calamares

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(f5c2e7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

misc {
    disable_watchdog_warning = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mod = SUPER
bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, nautilus
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

windowrule = float,        class:^(calamares)$
windowrule = center,       class:^(calamares)$
windowrule = size 1000 700, class:^(calamares)$

windowrule = float,  class:^(nm-connection-editor)$
windowrule = center, class:^(nm-connection-editor)$

windowrule = float,  class:^(yad)$
windowrule = center, class:^(yad)$
