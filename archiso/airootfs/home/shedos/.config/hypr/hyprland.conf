# ShedOS Live Installer - Hyprland Configuration
# Minimal config for running Calamares installer

# Monitor configuration - auto-detect
monitor = ,preferred,auto,1

# Execute on startup
exec-once = elephant &
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = waybar
exec-once = mako
exec-once = awww-daemon
exec-once = sleep 1 && awww img ~/.config/hypr/shedos_wallpaper_logo_4k.png
exec-once = sleep 2 && sudo -E calamares

# Environment variables for Wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11

# Input configuration
input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# General appearance
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(f5c2e7ee) 45deg
    col.inactive_border = rgba(45475aaa)
    layout = dwindle
}

# Decoration
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
}

# Animations
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings
$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, nautilus
bind = $mod, V, togglefloating
bind = $mod, D, exec, walker
bind = $mod, F, fullscreen

# Move focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3

# Move to workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

# Mouse bindings
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Hyprland 0.46+ uses block-form windowrules (see wiki Window-Rules page).

# Float, center and size Calamares
windowrule {
    name = calamares
    match:class = ^(calamares)$
    float = true
    center = true
    size = 1000 700
}

# Float polkit auth agent
windowrule {
    name = polkit-auth
    match:class = ^(polkit-gnome-authentication-agent-1)$
    float = true
    center = true
}
