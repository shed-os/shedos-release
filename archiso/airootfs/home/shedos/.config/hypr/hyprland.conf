# ShedOS Live Installer — minimal Hyprland config.
# Brings up: dusk wallpaper, waybar with nm-applet tray, mako
# notifications, a one-shot welcome popup, and Calamares. No login
# UI; agetty + .zprofile drop the shedos user straight into this
# session on tty1.

monitor = ,preferred,auto,1

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11

exec-once = swaybg -i /usr/share/shedos/wallpapers/dusk.png -m fill
exec-once = waybar
exec-once = nm-applet --indicator
exec-once = mako
exec-once = sleep 3 && yad --image=network-wireless --title="Welcome to ShedOS" --text="<b>Connect to Wi-Fi before installing.</b>\n\nClick the Wi-Fi tray icon (top-right corner) to pick your network and enter the password.\n\nThe Calamares installer will open automatically in a few seconds." --button=gtk-ok --width=440
exec-once = sleep 5 && sudo -E calamares

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)
    layout = dwindle
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    disable_watchdog_warning = true
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
    shadow {
        enabled = true
        range = 12
        render_power = 3
        color = rgba(1e1e2eee)
    }
}

animations {
    enabled = true
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, default, slide
    animation = border, 1, 8, default
    animation = fade, 1, 5, default
    animation = workspaces, 1, 6, overshot, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

$mod = SUPER

bind = $mod, Return, exec, kitty
bind = $mod, Q, killactive
bind = $mod, M, exit
bind = $mod, E, exec, nautilus
bind = $mod, V, togglefloating
bind = $mod, F, fullscreen

bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Hyprland 0.46+ block-form window rules. One block per pattern;
# `name` is just a stable identifier for the rule.

windowrule {
    name = float-calamares
    match:class = ^(calamares)$
    float = true
    center = true
    size = 1000 700
}

windowrule {
    name = float-nm-connection-editor
    match:class = ^(nm-connection-editor)$
    float = true
    center = true
}

windowrule {
    name = float-yad
    match:class = ^[Yy]ad$
    float = true
    center = true
}
