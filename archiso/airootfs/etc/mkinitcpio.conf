# Base mkinitcpio config; both live ISO and installed system inherit
# this. Live-only hooks are layered on top via /etc/mkinitcpio.conf.d/
# archiso.conf, which unpackfs-exclude.conf drops on install.

MODULES=()

BINARIES=()

FILES=()

HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block plymouth filesystems fsck)

COMPRESSION="zstd"
