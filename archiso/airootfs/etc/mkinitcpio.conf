# ShedOS mkinitcpio configuration
#
# This is the BASE config the installed system inherits via Calamares
# unpackfs. Live-ISO-only hooks (archiso, archiso_loop_mnt) are NOT in
# HOOKS here — they live in /etc/mkinitcpio.conf.d/archiso.conf which
# unpackfs-exclude.conf drops on install. Putting them in this file
# breaks `mkinitcpio -p linux` on the target because the archiso
# package isn't installed there.
#
# `plymouth` stays here so the boot splash (shedos-branding) renders
# on both the live ISO and the installed system.

MODULES=()

BINARIES=()

FILES=()

HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block plymouth filesystems fsck)

COMPRESSION="zstd"
