# cpplint configuration for Neovim
# Relaxed settings focused on actual errors, not style nitpicks

# Line length
linelength=120

# Filters to disable overly strict checks
# - = disable, + = enable
filter=-build/header_guard
filter=-build/include_order
filter=-build/namespaces
filter=-legal/copyright
filter=-readability/todo
filter=-whitespace/braces
filter=-whitespace/comments
filter=-whitespace/indent
filter=-whitespace/line_length
filter=-whitespace/newline
filter=-whitespace/operators
filter=-whitespace/parens
filter=-whitespace/tab
filter=-runtime/references
filter=-runtime/int
filter=-readability/casting
filter=-build/c++11

# Extensions to check
extensions=c,cc,cpp,cxx,h,hpp,hxx

# Root directory (use current directory)
root=.
