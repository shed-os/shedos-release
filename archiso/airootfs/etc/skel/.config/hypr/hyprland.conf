# shedOS Hyprland Configuration
# Theme: Catppuccin Mocha

# ─────────────────────────────────────────────────────────────
# Environment Variables
# ─────────────────────────────────────────────────────────────

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# XDG
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_DATA_DIRS,/usr/local/share:/usr/share

# Qt
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GTK
env = GDK_BACKEND,wayland,x11,*
env = GTK_THEME,Catppuccin-Mocha-Standard-Blue-Dark

# NVIDIA (uncomment if using NVIDIA)
# env = LIBVA_DRIVER_NAME,nvidia
# env = GBM_BACKEND,nvidia-drm
# env = __GLX_VENDOR_LIBRARY_NAME,nvidia
# env = NVD_BACKEND,direct

xwayland {
    force_zero_scaling = true
}

# Don't show ecosystem update
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ─────────────────────────────────────────────────────────────
# Monitor Configuration
# ─────────────────────────────────────────────────────────────

# Default: auto-detect monitors
monitor = ,preferred,auto,1

# Example for specific monitors:
# monitor = DP-1,2560x1440@144,0x0,1
# monitor = HDMI-A-1,1920x1080@60,2560x0,1

# ─────────────────────────────────────────────────────────────
# Startup Applications
# ─────────────────────────────────────────────────────────────

# Start elephant data provider for walker
exec-once = elephant &
exec-once = waybar
exec-once = mako
exec-once = /usr/local/bin/shedos-user-session.sh --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = swww-daemon
exec-once = sleep 1 && swww img ~/.config/hypr/wallpapers/colorifed.png
exec-once = hypridle
exec-once = hyprlock

# ─────────────────────────────────────────────────────────────
# Input Configuration
# ─────────────────────────────────────────────────────────────

input {
    kb_layout = us
    kb_options = caps:escape

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }

    sensitivity = 0
    accel_profile = flat
}

# ─────────────────────────────────────────────────────────────
# General Settings
# ─────────────────────────────────────────────────────────────

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    # Catppuccin Mocha colors
    col.active_border = rgba(89b4faee) rgba(cba6f7ee) 45deg
    col.inactive_border = rgba(585b70aa)

    layout = dwindle
    allow_tearing = false
}

# ─────────────────────────────────────────────────────────────
# Decoration
# ─────────────────────────────────────────────────────────────

decoration {
    rounding = 10

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        xray = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(1e1e2eee)
    }
}

# ─────────────────────────────────────────────────────────────
# Animations
# ─────────────────────────────────────────────────────────────

animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1

    animation = windows, 1, 5, overshot, slide
    animation = windowsOut, 1, 4, smoothOut, slide
    animation = windowsMove, 1, 4, default
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 5, smoothIn
    animation = fadeDim, 1, 5, smoothIn
    animation = workspaces, 1, 6, overshot, slidevert
}

# ─────────────────────────────────────────────────────────────
# Layouts
# ─────────────────────────────────────────────────────────────

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}

# ─────────────────────────────────────────────────────────────
# Miscellaneous
# ─────────────────────────────────────────────────────────────

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
    vfr = true
}

# ─────────────────────────────────────────────────────────────
# Window Rules
# ─────────────────────────────────────────────────────────────

# Float certain windows
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = size 800 600, class:^(blueman-manager)$
windowrulev2 = center, class:^(blueman-manager)$
windowrulev2 = float, class:^(bluetui)$
windowrulev2 = float, class:^(impala)$
windowrulev2 = float, class:^(bluetui)$
windowrulev2 = size 800 600, class:^(impala)$
windowrulev2 = size 800 600, class:^(bluetui)$
windowrulev2 = size 800 600, class:^(btop)$
windowrulev2 = center, class:^(impala)$
windowrulev2 = center, class:^(bluetui)$
windowrulev2 = center, class:^(btop)$
windowrulev2 = float, class:^(btop)$
windowrulev2 = float, class:^(firefox)$,title:^(Picture-in-Picture)$
windowrulev2 = float, class:^(vlc)$

# Pin PiP windows
windowrulev2 = pin, class:^(firefox)$,title:^(Picture-in-Picture)$

# Opacity
windowrulev2 = opacity 0.95 0.9, class:^(kitty)$
windowrulev2 = opacity 0.95 0.9, class:^(code-url-handler)$

# ─────────────────────────────────────────────────────────────
# Key Bindings
# ─────────────────────────────────────────────────────────────

$mainMod = SUPER

# Applications
bind = $mainMod, Return, exec, kitty
bind = $mainMod, D, exec, shedos-launch-walker
bind = $mainMod, E, exec, nautilus
bind = $mainMod, B, exec, firefox
bind = $mainMod SHIFT, Return, exec, kitty --class=floating-terminal

# Window Management
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, M, fullscreen, 1
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

# Focus
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod SHIFT, J, movefocus, d

# Move windows
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u

# Resize windows
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50
bind = $mainMod CTRL, H, resizeactive, -50 0
bind = $mainMod CTRL, L, resizeactive, 50 0
bind = $mainMod CTRL, K, resizeactive, 0 -50
bind = $mainMod CTRL, J, resizeactive, 0 50

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = SHIFT, Print, exec, grim - | swappy -f -
bind = $mainMod, Print, exec, grim -g "$(slurp)" ~/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Screen Recording
bind = $mainMod, R, exec, ~/.config/hypr/scripts/record-screen.sh
bind = $mainMod SHIFT, R, exec, ~/.config/hypr/scripts/stop-recording.sh

# Color Picker
bind = $mainMod SHIFT, P, exec, hyprpicker -a

# Clipboard history
bind = $mainMod, C, exec, walker -m clipbaord

# Lock screen
bind = $mainMod, Escape, exec, hyprlock

# System controls
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, R, exec, hyprctl reload

# Night Light
bind = $mainMod, F9, exec, /usr/local/bin/toggle-hyprsunset.sh

# Audio controls
bind = , XF86AudioRaiseVolume, exec, pamixer -i 5
bind = , XF86AudioLowerVolume, exec, pamixer -d 5
bind = , XF86AudioMute, exec, pamixer -t
bind = , XF86AudioMicMute, exec, pamixer --default-source -t

# Brightness controls
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
