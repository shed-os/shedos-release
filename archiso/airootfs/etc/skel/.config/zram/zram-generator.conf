# ShedOS Zram Configuration
# /etc/systemd/zram-generator.conf

[zram0]
# Use zstd compression (better ratio)
compression-algorithm = zstd

# Size: half of RAM, max 8GB
zram-size = min(ram / 2, 8192)

# Swap priority (higher than disk swap)
swap-priority = 100

# Filesystem type (swap for swap, ext4/btrfs for tmpfs)
fs-type = swap
