# ShedOS Kitty Terminal Configuration
# Theme: Catppuccin Mocha

# ─────────────────────────────────────────────────────────────
# Font Configuration
# ─────────────────────────────────────────────────────────────

font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Enable programming ligatures (e.g., ->, ==, !=, <=, >=, etc.)
disable_ligatures never

# Symbol/emoji fallback fonts
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6AA,U+E700-U+E7C5,U+EA60-U+EBEB,U+F000-U+F2E0,U+F300-U+F32F,U+F400-U+F4A9,U+F500-U+FD46 Symbols Nerd Font

# Adjust line height
adjust_line_height 110%

# ─────────────────────────────────────────────────────────────
# Cursor
# ─────────────────────────────────────────────────────────────

cursor_shape               beam
cursor_beam_thickness      1.5
cursor_blink_interval      0.5
cursor_stop_blinking_after 15.0

# ─────────────────────────────────────────────────────────────
# Scrollback
# ─────────────────────────────────────────────────────────────

scrollback_lines         10000
scrollback_pager         less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
wheel_scroll_multiplier  5.0
touch_scroll_multiplier  1.0

# ─────────────────────────────────────────────────────────────
# Mouse
# ─────────────────────────────────────────────────────────────

url_style            curly
open_url_with        default
url_prefixes         file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls          yes
copy_on_select       yes
strip_trailing_spaces smart

# ─────────────────────────────────────────────────────────────
# Performance
# ─────────────────────────────────────────────────────────────

repaint_delay   10
input_delay     3
sync_to_monitor yes

# ─────────────────────────────────────────────────────────────
# Bell
# ─────────────────────────────────────────────────────────────

enable_audio_bell    no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab          "🔔 "

# ─────────────────────────────────────────────────────────────
# Window
# ─────────────────────────────────────────────────────────────

remember_window_size  yes
initial_window_width  120c
initial_window_height 35c
window_padding_width  10
window_margin_width   0
single_window_margin_width -1
hide_window_decorations yes
confirm_os_window_close 0

# ─────────────────────────────────────────────────────────────
# Tab Bar
# ─────────────────────────────────────────────────────────────

tab_bar_edge            bottom
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2
tab_switch_strategy     previous
tab_title_template      "{index}: {title}"
active_tab_font_style   bold

# ─────────────────────────────────────────────────────────────
# Color Scheme: Catppuccin Mocha
# ─────────────────────────────────────────────────────────────

# The basic colors
foreground              #CDD6F4
background              #1E1E2E
selection_foreground    #1E1E2E
selection_background    #F5E0DC

# Cursor colors
cursor                  #F5E0DC
cursor_text_color       #1E1E2E

# URL underline color when hovering with mouse
url_color               #F5E0DC

# Kitty window border colors
active_border_color     #B4BEFE
inactive_border_color   #6C7086
bell_border_color       #F9E2AF

# Tab bar colors
active_tab_foreground   #11111B
active_tab_background   #CBA6F7
inactive_tab_foreground #CDD6F4
inactive_tab_background #181825
tab_bar_background      #11111B

# Colors for marks
mark1_foreground #1E1E2E
mark1_background #B4BEFE
mark2_foreground #1E1E2E
mark2_background #CBA6F7
mark3_foreground #1E1E2E
mark3_background #74C7EC

# The 16 terminal colors

# black
color0 #45475A
color8 #585B70

# red
color1 #F38BA8
color9 #F38BA8

# green
color2  #A6E3A1
color10 #A6E3A1

# yellow
color3  #F9E2AF
color11 #F9E2AF

# blue
color4  #89B4FA
color12 #89B4FA

# magenta
color5  #F5C2E7
color13 #F5C2E7

# cyan
color6  #94E2D5
color14 #94E2D5

# white
color7  #BAC2DE
color15 #A6ADC8

# ─────────────────────────────────────────────────────────────
# Keyboard Shortcuts
# ─────────────────────────────────────────────────────────────

# Clear default shortcuts
clear_all_shortcuts no

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Scrolling
map ctrl+shift+up        scroll_line_up
map ctrl+shift+down      scroll_line_down
map ctrl+shift+page_up   scroll_page_up
map ctrl+shift+page_down scroll_page_down
map ctrl+shift+home      scroll_home
map ctrl+shift+end       scroll_end

# Font sizes
map ctrl+shift+equal     change_font_size all +2.0
map ctrl+shift+minus     change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0

# Tab management
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward

# Window management
map ctrl+shift+enter new_window
map ctrl+shift+w     close_window
map ctrl+shift+]     next_window
map ctrl+shift+[     previous_window

# Layout
map ctrl+shift+l next_layout

# Shell integration
shell_integration enabled
