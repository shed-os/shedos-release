# Live-ISO HOOKS override. unpackfs-exclude.conf drops this file on
# install so the target reverts to the base HOOKS in mkinitcpio.conf.
#
# kms must come BEFORE plymouth so the real GPU driver (i915, amdgpu,
# nouveau) loads first. Otherwise Plymouth renders to simpledrm's early
# framebuffer, which gets replaced when the real driver takes over fb0,
# and Plymouth doesn't redraw; boot screen stays blank.

HOOKS=(base udev modconf kms keyboard plymouth archiso archiso_loop_mnt block filesystems shedos-eject)
