# Live-ISO-only mkinitcpio overrides.
#
# REPLACES the HOOKS array from /etc/mkinitcpio.conf when the live
# ISO boots, swapping in archiso's hooks so the kernel can mount
# the squashfs root from the booted media. unpackfs-exclude.conf
# drops this file on install so the target system reverts to the
# stock HOOKS in /etc/mkinitcpio.conf.

HOOKS=(base udev plymouth modconf archiso archiso_loop_mnt block filesystems keyboard)
