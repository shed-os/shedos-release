name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install test dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --needed --noconfirm \
              base-devel git sudo jq rclone gnupg python python-yaml git-filter-repo
          # archlinux:latest ships an empty keyring; populate it for makepkg.
          pacman-key --init
          pacman-key --populate archlinux
          # The harnesses build real packages, and makepkg refuses to run as root.
          useradd -m tester

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Trust workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate the workflow YAML
        run: |
          for f in .github/workflows/*.yml; do
              python3 -c 'import yaml,sys; yaml.safe_load(open(sys.argv[1]))' "$f"
              echo "$f parses"
          done

      # Every suite runs even when an earlier one fails: a red suite hiding
      # the state of the others lets a second defect ride out on the fix for
      # the first.
      - name: Run the harnesses
        run: |
          chown -R tester:tester .
          failed=
          for suite in test/*/run.sh; do
              echo "::group::$suite"
              sudo -u tester -H bash "$suite" || failed="$failed $suite"
              echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
              echo "failed:$failed"
              exit 1
          fi
          echo "every harness passed"
